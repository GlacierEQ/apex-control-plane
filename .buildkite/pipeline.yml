# Temporary APEX bootstrap executor for Telecom.
# This branch intentionally uses Buildkite-hosted compute so Telecom validation
# does not depend on the offline macos-self agent.

env:
  TELECOM_REPOSITORY: "git@github.com:GlacierEQ/Telecom-valley-atlas-cabin-solar.git"
  TELECOM_BRANCH: "feat/telecom-foundation-boot-v1"
  TELECOM_COMMIT: "651e51e2adc2e52e046e65362aa7c648c897fdd1"
  NPM_CONFIG_FUND: "false"

steps:
  - label: ":telephone_receiver: Telecom exact-SHA hosted verification"
    key: telecom-hosted-verification
    timeout_in_minutes: 35
    agents:
      queue: linux-small
    command: |
      set -euo pipefail
      root="$$PWD"
      work="$$root/.telecom-bootstrap"
      out="$$root/artifacts/buildkite"
      rm -rf "$$work"
      mkdir -p "$$work" "$$out"

      {
        echo "apex_build_id=$$BUILDKITE_BUILD_ID"
        echo "apex_build_number=$$BUILDKITE_BUILD_NUMBER"
        echo "apex_pipeline=$$BUILDKITE_PIPELINE_SLUG"
        echo "telecom_branch=$$TELECOM_BRANCH"
        echo "telecom_requested_sha=$$TELECOM_COMMIT"
        uname -a
        git --version
        node --version
        npm --version
        python3 --version

        git clone --no-checkout "$$TELECOM_REPOSITORY" "$$work/repo"
        cd "$$work/repo"
        git fetch origin "$$TELECOM_COMMIT" --depth=1
        git checkout --detach "$$TELECOM_COMMIT"
        actual="$$(git rev-parse HEAD)"
        test "$$actual" = "$$TELECOM_COMMIT"
        echo "telecom_checkout_sha=$$actual"

        npm ci --ignore-scripts
        npm run typecheck
        npm run test:platform:stable
        npm run test:platform:baseline
        npm run test:app
        npm run test:telecom
        npm run test:sidecar
        npm run lint:telecom
        npm run lint:baseline
        npm run build:dev
        npm run verify:repo-family
        npm audit --omit=dev --audit-level=high
      } 2>&1 | tee "$$out/telecom-hosted-verification.log"

      cd "$$root"
      test -f "$$work/repo/verification/EVIDENCE.md" && cp "$$work/repo/verification/EVIDENCE.md" "$$out/telecom-repo-family-evidence.md" || true

      python3 - <<'PY'
      import hashlib
      import json
      import os
      from datetime import datetime, timezone
      from pathlib import Path

      out = Path("artifacts/buildkite")
      log = out / "telecom-hosted-verification.log"
      evidence = out / "telecom-repo-family-evidence.md"
      requested = os.environ["TELECOM_COMMIT"]
      data = {
          "schema": "glaciereq.apex.telecom-hosted-bootstrap.v1",
          "status": "PASS",
          "executor": "buildkite-hosted",
          "buildkite": {
              "organization": os.environ.get("BUILDKITE_ORGANIZATION_SLUG"),
              "pipeline": os.environ.get("BUILDKITE_PIPELINE_SLUG"),
              "build_id": os.environ.get("BUILDKITE_BUILD_ID"),
              "build_number": os.environ.get("BUILDKITE_BUILD_NUMBER"),
              "build_url": os.environ.get("BUILDKITE_BUILD_URL"),
              "job_id": os.environ.get("BUILDKITE_JOB_ID"),
          },
          "telecom": {
              "repository": "GlacierEQ/Telecom-valley-atlas-cabin-solar",
              "branch": os.environ["TELECOM_BRANCH"],
              "commit": requested,
              "exact_sha_verified": True,
          },
          "artifacts": {},
          "credential_values_recorded": False,
          "generated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
      }
      for path in (log, evidence):
          if path.is_file():
              raw = path.read_bytes()
              data["artifacts"][path.name] = {
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "size_bytes": len(raw),
              }
      receipt = out / "telecom-hosted-buildkite-receipt.json"
      encoded = (json.dumps(data, indent=2, sort_keys=True) + "\n").encode()
      receipt.write_bytes(encoded)
      digest = hashlib.sha256(encoded).hexdigest()
      (out / "telecom-hosted-buildkite-receipt.json.sha256").write_text(
          f"{digest}  {receipt.name}\n",
          encoding="utf-8",
      )
      print(json.dumps(data, indent=2, sort_keys=True))
      PY

      rm -rf "$$work"
    artifact_paths:
      - "artifacts/buildkite/telecom-hosted-verification.log"
      - "artifacts/buildkite/telecom-repo-family-evidence.md"
      - "artifacts/buildkite/telecom-hosted-buildkite-receipt.json"
      - "artifacts/buildkite/telecom-hosted-buildkite-receipt.json.sha256"
