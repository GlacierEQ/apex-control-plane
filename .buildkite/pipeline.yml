# Proactive CI for GlacierEQ/apex-control-plane (overhaul 2026-10-24).
# One step: verify exact commit, compile the proactive surfaces, run the
# full local suite, and emit a CI receipt + digest. No step names a
# deleted file; a green run with changed test bytes is caught by the
# test-hash gate in tests/test_apex_proactive.py, not by CI prose.
steps:
  - label: ":white_check_mark: Proactive suite"
    key: proactive-suite
    timeout_in_minutes: 10
    agents:
      queue: linux-small
    command: |
      set -euo pipefail
      actual="$(git rev-parse HEAD)"
      test "$actual" = "$BUILDKITE_COMMIT"
      mkdir -p artifacts/buildkite
      python3 --version
      python3 -m py_compile src/mission_fidelity_admission.py src/apex_session_gateway.py src/connector_mission_router.py src/control_plane.py src/model_attractor_defense.py
      python3 -m json.tool config/continuous_control_plane.json >/dev/null
      python3 -m json.tool config/model_attractor_defense_policy.json >/dev/null
      python3 -m pip install --upgrade pytest
      PYTHONPATH=src:. python3 -m pytest -q tests/test_model_attractor_defense.py
      PYTHONPATH=src:. python3 -m pytest -q tests/ 2>&1 | tee artifacts/buildkite/proactive-suite.log
      python3 -c "import json; json.dump({'commit': '$BUILDKITE_COMMIT', 'suite': 'proactive', 'log': 'artifacts/buildkite/proactive-suite.log'}, open('artifacts/buildkite/verified-ci-receipt.json', 'w'), sort_keys=True)"
      sha256sum artifacts/buildkite/verified-ci-receipt.json > artifacts/buildkite/SHA256SUMS
