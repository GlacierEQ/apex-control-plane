[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-control-plane"
version = "1.1.0"
description = "APEX runtime control plane: validated event envelopes, capacity-aware dispatch, immutable receipts."
readme = "README.md"
# src/ modules use dataclasses(slots=True) (Python 3.10+) and PEP 604 unions.
# CI runs 3.12. The system Python 3.9 on the operator host cannot import them.
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "GlacierEQ" }]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]