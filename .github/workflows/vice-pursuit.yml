name: VICE pursuit evidence-to-effect verification

on:
  pull_request:
    paths:
      - 'src/pursuit_engine.py'
      - 'tests/test_pursuit_engine.py'
      - '.github/workflows/vice-pursuit.yml'
  push:
    branches: [main]
    paths:
      - 'src/pursuit_engine.py'
      - 'tests/test_pursuit_engine.py'
      - '.github/workflows/vice-pursuit.yml'

jobs:
  pursuit-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify pursuit evidence, actor, counterclaim and dispatch boundaries
        run: python -m unittest discover -s tests -p 'test_pursuit_engine.py' -v
      - name: Verify existing connector-effect contract
        run: python -m unittest discover -s tests -p 'test_connector_mission_router.py' -v
