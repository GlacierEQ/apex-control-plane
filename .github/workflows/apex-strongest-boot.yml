name: APEX Strongest Boot

on:
  push:
    branches: [main]
    paths:
      - "src/apex_strong_boot.py"
      - "src/apex_runtime_kernel.py"
      - "src/control_plane.py"
      - "src/sitecustomize.py"
      - "src/apex_enforced_startup.py"
      - "src/operator_fidelity_lock.py"
      - "src/operator_fidelity_preflight.py"
      - "src/notion_continuity_gate.py"
      - "src/prime_directive_boot.py"
      - "tests/test_apex_strong_boot.py"
      - "tests/test_apex_runtime_kernel.py"
      - "tests/test_control_plane.py"
      - ".github/workflows/apex-strongest-boot.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/apex_strong_boot.py"
      - "src/apex_runtime_kernel.py"
      - "src/control_plane.py"
      - "src/sitecustomize.py"
      - "src/apex_enforced_startup.py"
      - "src/operator_fidelity_lock.py"
      - "src/operator_fidelity_preflight.py"
      - "src/notion_continuity_gate.py"
      - "src/prime_directive_boot.py"
      - "tests/test_apex_strong_boot.py"
      - "tests/test_apex_runtime_kernel.py"
      - "tests/test_control_plane.py"
      - ".github/workflows/apex-strongest-boot.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove strongest boot (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile complete boot spine
        run: |
          python -m py_compile \
            src/apex_strong_boot.py \
            src/apex_runtime_kernel.py \
            src/apex_enforced_startup.py \
            src/notion_continuity_gate.py \
            src/prime_directive_boot.py \
            src/operator_fidelity_lock.py \
            src/operator_fidelity_preflight.py \
            src/control_plane.py \
            src/sitecustomize.py

      - name: Prove strong-boot and runtime invariants
        run: |
          CASEY_AUTO_BOOT_TESTING=1 PYTHONPATH=src:. python -m pytest -q \
            tests/test_apex_strong_boot.py \
            tests/test_apex_runtime_kernel.py \
            tests/test_control_plane.py

      - name: Prove runtime entrypoint fails closed without receipts
        shell: bash
        run: |
          set +e
          CASEY_AUTO_BOOT_MODE=strict python src/control_plane.py >/tmp/strong.out 2>/tmp/strong.err
          status=$?
          set -e
          test "$status" -eq 78
          test ! -s /tmp/strong.out
          grep -q 'glaciereq_notion_continuity_preflight' /tmp/strong.err
          grep -q 'glaciereq_prime_directive_auto_boot' /tmp/strong.err
          grep -q 'strong_boot_status' /tmp/strong.err

      - name: Prove request-mode auto-boot is diagnostic only
        shell: bash
        run: |
          PYTHONPATH=src \
          CASEY_AUTO_BOOT=1 \
          CASEY_AUTO_BOOT_MODE=request \
          python -c 'import os, sitecustomize; assert sitecustomize.APEX_STRONG_BOOT_SESSION is None; assert sitecustomize.APEX_RUNTIME_KERNEL is None; assert os.environ.get("GLACIEREQ_EXTERNAL_ACTION_AUTHORIZED") == "0"; assert os.environ.get("GLACIEREQ_STRONG_BOOT_STATUS") == "continuation_required"'
