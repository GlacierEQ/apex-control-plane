name: APEX Strongest Boot

on:
  push:
    branches: [main]
    paths:
      - "src/apex_strong_boot.py"
      - "src/strict_frontier_preflight.py"
      - "src/strict_executable_frontier_authority.py"
      - "src/execution_dependency_enumerator_authority.py"
      - "src/executable_frontier_authority.py"
      - "src/apex_runtime_kernel.py"
      - "src/verified_runtime_entrypoint.py"
      - "src/runtime_execution_guard.py"
      - "src/epistemic_risk_gate.py"
      - "src/control_plane.py"
      - "src/control_plane_runtime.py"
      - "src/sitecustomize.py"
      - "src/apex_enforced_startup.py"
      - "src/operator_fidelity_lock.py"
      - "src/operator_fidelity_preflight.py"
      - "src/notion_continuity_gate.py"
      - "src/prime_directive_boot.py"
      - "tests/test_apex_strong_boot.py"
      - "tests/test_strict_frontier_runtime_cutover.py"
      - "tests/test_strict_executable_frontier_authority.py"
      - "tests/test_execution_dependency_enumerator_authority.py"
      - "tests/test_apex_runtime_kernel.py"
      - "tests/test_verified_runtime_entrypoint.py"
      - "tests/test_runtime_execution_guard.py"
      - "tests/test_control_plane.py"
      - ".github/workflows/apex-strongest-boot.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/apex_strong_boot.py"
      - "src/strict_frontier_preflight.py"
      - "src/strict_executable_frontier_authority.py"
      - "src/execution_dependency_enumerator_authority.py"
      - "src/executable_frontier_authority.py"
      - "src/apex_runtime_kernel.py"
      - "src/verified_runtime_entrypoint.py"
      - "src/runtime_execution_guard.py"
      - "src/epistemic_risk_gate.py"
      - "src/control_plane.py"
      - "src/control_plane_runtime.py"
      - "src/sitecustomize.py"
      - "src/apex_enforced_startup.py"
      - "src/operator_fidelity_lock.py"
      - "src/operator_fidelity_preflight.py"
      - "src/notion_continuity_gate.py"
      - "src/prime_directive_boot.py"
      - "tests/test_apex_strong_boot.py"
      - "tests/test_strict_frontier_runtime_cutover.py"
      - "tests/test_strict_executable_frontier_authority.py"
      - "tests/test_execution_dependency_enumerator_authority.py"
      - "tests/test_apex_runtime_kernel.py"
      - "tests/test_verified_runtime_entrypoint.py"
      - "tests/test_runtime_execution_guard.py"
      - "tests/test_control_plane.py"
      - ".github/workflows/apex-strongest-boot.yml"

permissions:
  contents: read

jobs:
  prove:
    name: prove strongest boot (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile complete boot, strict frontier, and runtime spine
        run: |
          python -m py_compile \
            src/apex_strong_boot.py \
            src/strict_frontier_preflight.py \
            src/strict_executable_frontier_authority.py \
            src/execution_dependency_enumerator_authority.py \
            src/executable_frontier_authority.py \
            src/apex_runtime_kernel.py \
            src/verified_runtime_entrypoint.py \
            src/runtime_execution_guard.py \
            src/epistemic_risk_gate.py \
            src/apex_enforced_startup.py \
            src/notion_continuity_gate.py \
            src/prime_directive_boot.py \
            src/operator_fidelity_lock.py \
            src/operator_fidelity_preflight.py \
            src/control_plane.py \
            src/control_plane_runtime.py \
            src/sitecustomize.py

      - name: Prove strong-boot, strict frontier, and runtime invariants
        run: |
          CASEY_AUTO_BOOT_TESTING=1 PYTHONPATH=src:. python -m pytest -q \
            tests/test_apex_strong_boot.py \
            tests/test_strict_frontier_runtime_cutover.py \
            tests/test_strict_executable_frontier_authority.py \
            tests/test_execution_dependency_enumerator_authority.py \
            tests/test_apex_runtime_kernel.py \
            tests/test_verified_runtime_entrypoint.py \
            tests/test_runtime_execution_guard.py \
            tests/test_control_plane.py

      - name: Prove strict frontier becomes diagnostic without receipt
        shell: bash
        run: |
          CASEY_AUTO_BOOT_TESTING=1 PYTHONPATH=src:. python - <<'PY'
          from apex_strong_boot import _run_model_attractor_preflight

          diagnostics = []
          _run_model_attractor_preflight(diagnostics)
          assert diagnostics == [
              "strict_executable_frontier_authority: strict frontier preflight requires a boot receipt"
          ], diagnostics
          PY

      - name: Prove runtime entrypoint continues with startup diagnostics
        shell: bash
        run: |
          CASEY_AUTO_BOOT_MODE=strict PYTHONPATH=src:. python src/control_plane.py >/tmp/strong.out 2>/tmp/strong.err
          grep -q '"phase":"complete"' /tmp/strong.out
          grep -q '"startup_diagnostics"' /tmp/strong.out
          grep -q 'continuation_required' /tmp/strong.err

      - name: Prove strict Python auto-boot continues after enrichment checks
        shell: bash
        run: |
          PYTHONPATH=src \
          CASEY_AUTO_BOOT=1 \
          CASEY_AUTO_BOOT_MODE=strict \
          python -c 'import sitecustomize; assert sitecustomize.APEX_STRONG_BOOT_SESSION is not None; assert sitecustomize.APEX_RUNTIME_KERNEL is not None; print("RAN")' \
          >/tmp/site.out 2>/tmp/site.err
          grep -q 'RAN' /tmp/site.out
          grep -q 'continuation_required' /tmp/site.err

      - name: Prove legacy runtime cannot bypass verified boundary
        shell: bash
        run: |
          set +e
          CASEY_AUTO_BOOT_MODE=strict python src/control_plane_runtime.py >/tmp/legacy.out 2>/tmp/legacy.err
          status=$?
          set -e
          test "$status" -eq 78
          test ! -s /tmp/legacy.out
          grep -q 'direct control_plane_runtime execution is disabled' /tmp/legacy.err

      - name: Prove request-mode auto-boot preserves diagnostics without authority inversion
        shell: bash
        run: |
          PYTHONPATH=src \
          CASEY_AUTO_BOOT=1 \
          CASEY_AUTO_BOOT_MODE=request \
          python -c 'import os, sitecustomize; assert sitecustomize.APEX_STRONG_BOOT_SESSION is not None; assert sitecustomize.APEX_RUNTIME_KERNEL is not None; assert "GLACIEREQ_EXTERNAL_ACTION_AUTHORIZED" not in os.environ; assert os.environ.get("GLACIEREQ_STRONG_BOOT_STATUS") == "complete"'
