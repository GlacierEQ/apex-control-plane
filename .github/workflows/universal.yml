name: universal

# The control plane is universal if and only if the same registry resolves on
# every host. This workflow proves that, and refuses anything that hardcodes a
# platform path — which is the defect that made 156 references unusable
# off-device before the variable rewrite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  universal:
    name: resolve on ${{ matrix.device }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [macbook, termux]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Registry parses as JSON
        run: |
          n=0
          for f in registry/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
            n=$((n+1))
          done
          echo "  $n configs parse"

      - name: No hardcoded platform paths in the registry
        # The whole point: registry/ must carry variables, never literals.
        # devices/ is EXEMPT by design — a termux profile must name Termux
        # paths, that is what makes it a profile rather than a guess.
        run: |
          if grep -lE '(com\.termux|/sdcard/|/data/data/)' registry/*.json; then
            echo "::error::registry config contains a hardcoded platform path"
            exit 1
          fi
          echo "  registry: 0 literal Android paths ($(ls registry/*.json | wc -l | tr -d ' ') configs)"

      - name: Device profiles are allowed to name their own platform
        run: |
          for d in devices/*.json; do
            printf "  %-22s declares: " "$(basename $d)"
            python3 -c "import json,sys;print(','.join(sorted(json.load(open(sys.argv[1])).get('vars',{}))))" "$d"
          done

      - name: No committed secrets
        run: |
          if git grep -nEI '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|gh[os]_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{15,}|eyJ[A-Za-z0-9_-]{30,}|ntn_[A-Za-z0-9]{20,})' -- ':!*.example'; then
            echo "::error::possible committed secret"
            exit 1
          fi
          echo "  no secret-shaped strings"

      - name: Every variable has a definition
        # An undefined ${VAR} is a malformed registry, not a host gap.
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, sys
          VAR = re.compile(r"\$\{([A-Z][A-Z0-9_]*)\}")
          defined = {"HOME", "TERMUX_PREFIX", "DEVICE_STORAGE", "DEVICE_DOWNLOADS"}
          for p in glob.glob("devices/*.json"):
              defined |= set(json.load(open(p)).get("vars", {}))
          missing = set()
          for f in glob.glob("registry/*.json"):
              raw = open(f, encoding="utf-8", errors="replace").read()
              missing |= {m for m in VAR.findall(raw) if m not in defined}
          if missing:
              print("  undefined:", sorted(missing)); sys.exit(1)
          print(f"  every variable defined by a device profile or host fact")
          EOF

      - name: Resolution report
        # Absent paths are EXPECTED on a partial host and do not fail the build.
        # Only an undefined variable, or a malformed registry, is a failure.
        run: |
          python3 tools/resolve.py --device ${{ matrix.device }} || true
