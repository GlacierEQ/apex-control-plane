name: Hummingbot $59 native paper smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/crypto-paper/**'
      - '.github/workflows/crypto-hummingbot-paper.yml'

permissions:
  contents: read

jobs:
  native-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install upstream Hummingbot (isolated paper profile)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.18.0 https://github.com/hummingbot/hummingbot.git "$RUNNER_TEMP/hummingbot"
          cd "$RUNNER_TEMP/hummingbot"
          printf 'n\n' | make setup
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docker-compose.yml')
          data = path.read_text()
          old = '    #   command: tail -f /dev/null'
          assert old in data, 'Upstream Docker host-mode syntax changed: inspect before proceeding'
          data = data.replace(old, '    command: tail -f /dev/null', 1)
          old_image = 'hummingbot/hummingbot:latest'
          assert old_image in data
          path.write_text(data.replace(old_image, 'hummingbot/hummingbot:version-2.18.0', 1))
          PY
          make deploy
          make link-cli HBOT_BIN="$RUNNER_TEMP/hbot-bin"
          echo "$RUNNER_TEMP/hbot-bin" >> "$GITHUB_PATH"

      - name: Run official strategy in paper-only mode
        run: |
          set -euo pipefail
          export HBOT_PASSWORD
          HBOT_PASSWORD="$(openssl rand -hex 32)"
          hbot --version
          bash ops/crypto-paper/start-hummingbot-paper.sh
          market_ready=0
          for attempt in $(seq 1 12); do
            hbot status --json > "$RUNNER_TEMP/hummingbot-paper-status.json"
            if python3 - "$RUNNER_TEMP/hummingbot-paper-status.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          errors = data.get('errors') or {}
          paper_balances = (data.get('balances') or {}).get('kraken_paper_trade') or {}
          message = data.get('format_status') or ''
          ready = (
              data.get('running') is True
              and data.get('strategy') == 'simple_pmm'
              and data.get('config') == 'glaciereq_59_paper.yml'
              and (data.get('snapshot_age_s') or 999) < 10
              and errors.get('count') == 0
              and 'Market connectors are not ready' not in message
              and bool(message)
              and bool(paper_balances)
              and isinstance(paper_balances.get('USD'), (float, int))
              and 0 <= paper_balances['USD'] <= 59.01
          )
          print(f"paper ready={ready} balance={paper_balances} status={message[:110]!r}")
          sys.exit(0 if ready else 1)
          PY
            then
              market_ready=1
              break
            fi
            sleep 15
          done
          if [ "$market_ready" -ne 1 ]; then
            echo 'PAPER MARKET NEVER BECAME READY; no completion credit' >&2
            hbot logs || true
            exit 1
          fi
          echo 'NATIVE PAPER MARKET READY; Kraken simulation only, no Coinbase connection'
          hbot stop

      - name: Stop isolated Hummingbot container
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hummingbot/docker-compose.yml" ]; then
            cd "$RUNNER_TEMP/hummingbot"
            docker compose --profile gateway down || true
          fi
