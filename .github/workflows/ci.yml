name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proactive-suite:
    name: Proactive suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile proactive surfaces
        run: |
          python -m py_compile src/mission_fidelity_admission.py src/apex_session_gateway.py src/connector_mission_router.py src/control_plane.py
          python -m json.tool config/continuous_control_plane.json >/dev/null
      - name: Full test suite
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=src:. python -m pytest -q tests/
