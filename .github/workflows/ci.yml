name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  estate-registry:
    name: Estate registry quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install --upgrade ruff mypy pytest

      - name: Ruff lint
        run: ruff check scripts/scan_repos.py tests/test_scan_repos.py --output-format=github

      - name: Ruff format check
        run: ruff format --check scripts/scan_repos.py tests/test_scan_repos.py

      - name: Mypy
        run: mypy scripts/scan_repos.py --ignore-missing-imports

      - name: Tests
        run: python -m pytest -q tests/test_scan_repos.py

  audit-hardening:
    name: Audit hardening quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade ruff pytest requests rich

      - name: Ruff lint
        run: >-
          ruff check daily_audit.py apex_runner.py tests/test_audit_hardening.py
          --output-format=github

      - name: Ruff format check
        run: ruff format --check daily_audit.py apex_runner.py tests/test_audit_hardening.py

      - name: Tests
        run: python -m pytest -q tests/test_audit_hardening.py

  repository-security:
    name: Repository security
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-ci.yml@418fb99ceaee8ba1623cef9c83c9360e20482fe3
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python
      run_tests: false
      run_lint: false
      run_security: true
      run_build: false
