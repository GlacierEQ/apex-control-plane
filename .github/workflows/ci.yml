name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  proactive-suite:
    name: Proactive suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile proactive surfaces
        id: compile_surfaces
        run: |
          python -m py_compile src/dynamic_execution_fabric.py src/apex_session_gateway.py src/connector_mission_router.py src/control_plane.py
          python -m json.tool config/continuous_control_plane.json >/dev/null
      - name: Full test suite
        id: full_test_suite
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=src:. python -m pytest -q tests/
      - name: Restore prior verified GitHub learning checkpoint
        id: restore_feedback
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.full_test_suite.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: .apex/learning
          key: glaciereq-github-learning-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            glaciereq-github-learning-v1-
      - name: Verify GitHub native-feedback integration
        id: native_feedback
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.full_test_suite.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GLACIEREQ_APEX_LEARNING_STATE_PATH: .apex/learning/model.json
        run: python scripts/verify_live_github_feedback.py
      - name: Save verified GitHub learning checkpoint
        id: save_feedback
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native_feedback.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .apex/learning
          key: glaciereq-github-learning-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report full-suite result as commit status
        # PR tokens may be read-only, so native status reporting is for main pushes.
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_RESULT: ${{ steps.compile_surfaces.outcome }}
          TEST_RESULT: ${{ steps.full_test_suite.outcome }}
          FEEDBACK_RESULT: ${{ steps.native_feedback.outcome }}
          CHECKPOINT_SAVE_RESULT: ${{ steps.save_feedback.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          complete = (
              os.environ.get("COMPILE_RESULT") == "success"
              and os.environ.get("TEST_RESULT") == "success"
              and (
                  os.environ.get("GITHUB_REF") != "refs/heads/main"
                  or (
                      os.environ.get("FEEDBACK_RESULT") == "success"
                      and os.environ.get("CHECKPOINT_SAVE_RESULT") == "success"
                  )
              )
          )
          state = "success" if complete else "failure"
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          payload = json.dumps({
              "state": state,
              "context": "GlacierEQ / full pytest suite",
              "description": (
                  "Compile and full pytest passed" if complete
                  else "Compile or full pytest did not pass"
              ),
              "target_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{repo}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              print(f"Commit CI status: {state}; provider HTTP {response.status}")
          PY
