name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proactive-suite:
    name: Proactive suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile proactive surfaces
        run: |
          python -m py_compile src/apex_session_gateway.py src/connector_mission_router.py src/control_plane.py
          python -m json.tool config/continuous_control_plane.json >/dev/null
      - name: CLI must not manufacture execution receipts
        run: |
          PYTHONPATH=src:. python src/control_plane.py > /tmp/apex-cli.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("/tmp/apex-cli.json").read_text())
          assert value["status"] == "NO_ROUTE_EXECUTED"
          assert value["execution_stage"] == "OBSERVED_ONLY"
          assert value["routes_run"] == 0
          assert value["provider_acceptance_id"] is None
          assert value["continuation_readback_id"] is None
          assert "receipt" not in value
          PY
      - name: Full test suite
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=src:. python -m pytest -q tests/
