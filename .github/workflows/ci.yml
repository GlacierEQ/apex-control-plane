name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  operator-fidelity:
    name: Operator fidelity hard stop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate fidelity policy
        run: python -m json.tool config/operator_fidelity_runtime_policy.json >/dev/null

      - name: Compile fidelity boundary
        run: |
          python -m py_compile \
            src/operator_fidelity_lock.py \
            src/operator_fidelity_preflight.py \
            src/control_plane.py \
            src/sitecustomize.py

      - name: Run instruction-displacement regression tests
        run: |
          python -m pip install --upgrade pytest
          CASEY_AUTO_BOOT_TESTING=1 PYTHONPATH=src:. python -m pytest -q \
            tests/test_operator_fidelity_lock.py \
            tests/test_operator_fidelity_preflight.py

      - name: Prove runtime fails closed without fidelity receipt
        shell: bash
        run: |
          set +e
          CASEY_AUTO_BOOT_MODE=strict python src/control_plane.py >/tmp/fidelity.out 2>/tmp/fidelity.err
          status=$?
          set -e
          if [[ "$status" -ne 78 ]]; then
            cat /tmp/fidelity.out || true
            cat /tmp/fidelity.err || true
            echo "expected fail-closed exit 78, received $status" >&2
            exit 1
          fi
          test ! -s /tmp/fidelity.out

      - name: Prove APEX is operational by default without external authority
        shell: bash
        run: |
          unset CASEY_AUTO_BOOT_MODE CASEY_AUTO_BOOT_DISABLE CASEY_BOOT_RECEIPT_PATH
          python src/control_plane.py >/tmp/apex-runtime.json 2>/tmp/apex-preflight.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/apex-runtime.json").read_text())
          assert result["status"] == "completed"
          assert result["external_action_authorized"] is False
          assert result["human_review_required"] is True
          PY

      - name: Prove environment disable cannot bypass fidelity
        shell: bash
        run: |
          set +e
          CASEY_AUTO_BOOT_DISABLE=1 CASEY_AUTO_BOOT_MODE=strict PYTHONPATH=src \
            python -c 'from operator_fidelity_lock import automatic_operator_fidelity_lock; automatic_operator_fidelity_lock()' \
            >/tmp/disable.out 2>/tmp/disable.err
          disable_status=$?
          CASEY_AUTO_BOOT_MODE=off PYTHONPATH=src \
            python -c 'from operator_fidelity_lock import automatic_operator_fidelity_lock; automatic_operator_fidelity_lock()' \
            >/tmp/off.out 2>/tmp/off.err
          off_status=$?
          set -e
          test "$disable_status" -eq 78
          test "$off_status" -eq 78
          grep -q 'cannot disable operator fidelity' /tmp/disable.err
          grep -q 'cannot disable operator fidelity' /tmp/off.err
          test ! -s /tmp/disable.out
          test ! -s /tmp/off.out

  estate-registry:
    name: Estate registry quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install --upgrade ruff mypy pytest

      - name: Operator fidelity lock inside legacy required surface
        run: |
          python -m py_compile src/operator_fidelity_lock.py src/operator_fidelity_preflight.py
          CASEY_AUTO_BOOT_TESTING=1 PYTHONPATH=src:. python -m pytest -q \
            tests/test_operator_fidelity_lock.py \
            tests/test_operator_fidelity_preflight.py

      - name: Ruff lint
        run: ruff check scripts/scan_repos.py tests/test_scan_repos.py --output-format=github

      - name: Ruff format check
        run: ruff format --check scripts/scan_repos.py tests/test_scan_repos.py

      - name: Mypy
        run: mypy scripts/scan_repos.py --ignore-missing-imports

      - name: Tests
        run: python -m pytest -q tests/test_scan_repos.py

  audit-hardening:
    name: Audit hardening quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade ruff pytest requests rich

      - name: Ruff lint
        run: >-
          ruff check daily_audit.py apex_runner.py tests/test_audit_hardening.py
          --output-format=github

      - name: Ruff format check
        run: ruff format --check daily_audit.py apex_runner.py tests/test_audit_hardening.py

      - name: Tests
        run: python -m pytest -q tests/test_audit_hardening.py

  repository-security:
    name: Repository security
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-ci.yml@6757957d290878b1c0831da95328dc29f65d77c9
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python
      run_tests: false
      run_lint: false
      run_security: true
      run_build: false
