name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proactive-suite:
    name: Runtime suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile current runtime surfaces
        run: |
          # Compile every current source module; avoid stale references to removed modules.
          python -m compileall -q src
          python -m json.tool config/continuous_control_plane.json >/dev/null
      - name: Full test suite
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=src:. python -m pytest -q tests/
