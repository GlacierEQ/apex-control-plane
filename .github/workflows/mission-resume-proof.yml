name: Mission resume proof

on:
  pull_request:
    paths:
      - "src/mission_resume.py"
      - "tests/test_mission_resume.py"
      - ".github/workflows/mission-resume-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-worker-recovery:
    name: Independent worker crash/readback/no-replay
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run fresh-process resume and negative tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_mission_resume.py
