name: Jack Casebuilder Forge

on:
  pull_request:
    branches: [main]
    paths:
      - "jack/src/casebuilder_forge.py"
      - "jack/config/casebuilder_forge_contract.json"
      - "jack/tests/test_casebuilder_forge.py"
      - "jack/README.md"
      - ".github/workflows/jack-casebuilder-forge.yml"
  push:
    branches: [main]
    paths:
      - "jack/src/casebuilder_forge.py"
      - "jack/config/casebuilder_forge_contract.json"
      - "jack/tests/test_casebuilder_forge.py"
      - "jack/README.md"
      - ".github/workflows/jack-casebuilder-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile Jack forge binding
        run: python -m py_compile jack/src/casebuilder_forge.py jack/src/jack_relentless_gate.py

      - name: Validate topology contract
        run: python -m json.tool jack/config/casebuilder_forge_contract.json >/dev/null

      - name: Run Jack forge adversarial tests
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=. python -m pytest -q             jack/tests/test_casebuilder_forge.py             jack/tests/test_jack_relentless_gate.py
