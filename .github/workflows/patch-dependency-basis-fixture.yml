name: Patch Dependency Basis Fixture

on:
  push:
    branches: [enforce-dependency-basis-frontier-runtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enforce-dependency-basis-frontier-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add source-bound basis to model attractor frontier fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_model_attractor_defense.py')
          text = path.read_text()
          old = '''        "required_execution_claim_ids": [],
        "verifier_ref": "independent:test-dependency-completeness-verifier",
'''
          new = '''        "required_execution_claim_ids": [],
        "dependency_basis": [
            {
                "basis_id": "basis:model-attractor-operator-source",
                "source_ref": "file:operator-source.txt",
                "source_kind": "operator_message",
                "source_sha256": _sha256(source),
                "span_start_byte": start,
                "span_end_byte": end,
                "span_sha256": _sha256(source[start:end]),
                "temporal_context": "synthetic runtime integration test",
                "contradiction_state": "active",
                "superseded_by": None,
                "verification_state": "source_resolved",
            }
        ],
        "verifier_ref": "independent:test-dependency-completeness-verifier",
'''
          if old not in text:
              raise SystemExit('target fixture block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fixture migration
        run: |
          git config user.name 'glaciereq-apex-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/test_model_attractor_defense.py
          git commit -m 'Migrate model attractor fixture to dependency basis authority'
          git push origin HEAD:enforce-dependency-basis-frontier-runtime
