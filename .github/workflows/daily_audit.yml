name: Daily Connector Audit

on:
  schedule:
    # 06:00 UTC daily = 20:00 HST on the previous calendar day (Hawaii does not observe DST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'manual run'

permissions:
  contents: write

concurrency:
  group: estate-registry-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect estate-wide GitHub credential
        id: estate_auth
        shell: bash
        env:
          APEX_GITHUB_TOKEN: ${{ secrets.APEX_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${APEX_GITHUB_TOKEN}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Estate registry skipped: APEX_GITHUB_TOKEN is not configured. Repo-scoped github.token will not be used for estate-wide enumeration."
          fi

      - name: Restore prior estate registry
        if: steps.estate_auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin estate-registry-state >/dev/null 2>&1
          state_ref_status=$?
          set -e

          if [[ "$state_ref_status" -eq 0 ]]; then
            git fetch --no-tags origin \
              refs/heads/estate-registry-state:refs/remotes/origin/estate-registry-state
            git show refs/remotes/origin/estate-registry-state:repo_registry.json \
              > repo_registry.json
          elif [[ "$state_ref_status" -ne 2 ]]; then
            echo "::error::Unable to determine estate-registry-state branch status (exit ${state_ref_status})."
            exit "$state_ref_status"
          fi

      - name: Refresh estate registry
        id: estate_registry
        if: steps.estate_auth.outputs.available == 'true'
        env:
          APEX_GITHUB_TOKEN: ${{ secrets.APEX_GITHUB_TOKEN }}
        run: python scripts/scan_repos.py

      - name: Persist estate registry state
        if: steps.estate_registry.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for file in repo_registry.json repo_registry_delta.json repo_scan.json; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty estate registry output: $file"
              exit 1
            fi
          done

          state_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$state_dir" >/dev/null 2>&1 || true
            rm -rf "$state_dir"
          }
          trap cleanup EXIT

          if git show-ref --verify --quiet refs/remotes/origin/estate-registry-state; then
            git worktree add --detach "$state_dir" refs/remotes/origin/estate-registry-state
          else
            git worktree add --detach "$state_dir" HEAD
            (
              cd "$state_dir"
              git switch --orphan estate-registry-state
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          cp repo_registry.json repo_registry_delta.json repo_scan.json "$state_dir"/
          (
            cd "$state_dir"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repo_registry.json repo_registry_delta.json repo_scan.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "state: refresh estate registry ${GITHUB_RUN_ID}"
            git push origin HEAD:refs/heads/estate-registry-state
          )

      - name: Install dependencies
        run: pip install psycopg2-binary supermemory python-dotenv requests

      - name: Run audit loop
        env:
          SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python integration/supermemory_neon/audit_loop.py

      - name: Upload estate registry receipt
        if: steps.estate_registry.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: estate-registry-${{ github.run_id }}
          path: |
            repo_registry.json
            repo_registry_delta.json
            repo_scan.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-log-${{ github.run_id }}
          path: integration/supermemory_neon/audit_output/
          retention-days: 7
          if-no-files-found: ignore
