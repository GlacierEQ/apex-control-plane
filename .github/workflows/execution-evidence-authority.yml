name: Execution Evidence Authority

on:
  pull_request:
    branches: [main]
    paths:
      - "src/execution_evidence_authority.py"
      - "tests/test_execution_evidence_authority.py"
      - ".github/workflows/execution-evidence-authority.yml"
  push:
    branches: [main]
    paths:
      - "src/execution_evidence_authority.py"
      - "tests/test_execution_evidence_authority.py"
      - ".github/workflows/execution-evidence-authority.yml"

permissions:
  contents: read

jobs:
  execution-evidence-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile execution evidence boundary
        run: python -m py_compile src/execution_evidence_authority.py
      - name: Run execution evidence adversarial suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_execution_evidence_authority.py
