name: Direct Connector Runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "config/apex_connector_contract_registry.json"
      - "config/apex_direct_connector_runtime.json"
      - "src/direct_connector_runtime_contract.py"
      - "scripts/admit_session_connector_receipts.py"
      - "scripts/prepare_approved_connector_action.py"
      - "scripts/admit_session_connector_execution_receipts.py"
      - "tests/test_direct_connector_runtime_contract.py"
      - ".github/workflows/direct-connector-runtime.yml"
  push:
    branches: [main]
    paths:
      - "config/apex_connector_contract_registry.json"
      - "config/apex_direct_connector_runtime.json"
      - "src/direct_connector_runtime_contract.py"
      - "scripts/admit_session_connector_receipts.py"
      - "scripts/prepare_approved_connector_action.py"
      - "scripts/admit_session_connector_execution_receipts.py"
      - "tests/test_direct_connector_runtime_contract.py"
      - ".github/workflows/direct-connector-runtime.yml"

permissions:
  contents: read

jobs:
  direct-connector-runtime:
    name: Direct connector runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source identity
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
            git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate direct connector configuration
        run: |
          python -m json.tool config/apex_connector_contract_registry.json >/dev/null
          python -m json.tool config/apex_direct_connector_runtime.json >/dev/null

      - name: Compile direct connector execution surfaces
        run: |
          python -m py_compile \
            src/direct_connector_runtime_contract.py \
            scripts/admit_session_connector_receipts.py \
            scripts/prepare_approved_connector_action.py \
            scripts/admit_session_connector_execution_receipts.py

      - name: Test direct connector runtime contract
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=src:. python -m pytest -q tests/test_direct_connector_runtime_contract.py
