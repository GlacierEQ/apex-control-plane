name: APEX + real Spiral cross-process continuity
on:
  pull_request:
    paths:
      - 'src/spiral_live_journal.py'
      - 'src/chat_context_admission.py'
      - 'src/continuity_admission_guard.py'
      - 'tests/test_chat_context_admission.py'
      - 'src/spiral_chat_handoff.py'
      - 'src/apex_runtime_kernel.py'
      - 'tests/test_spiral_live_journal.py'
      - 'tests/test_spiral_kernel_interface_preflight.py'
      - 'scripts/chatgpt_context_bridge.py'
      - 'tests/test_chatgpt_context_bridge_cli.py'
      - '.github/workflows/spiral-real-journal.yml'
  push:
    branches: [main]
    paths:
      - 'src/spiral_live_journal.py'
      - 'src/chat_context_admission.py'
      - 'src/continuity_admission_guard.py'
      - 'tests/test_chat_context_admission.py'
      - 'src/spiral_chat_handoff.py'
      - 'src/apex_runtime_kernel.py'
      - 'tests/test_spiral_live_journal.py'
      - 'tests/test_spiral_kernel_interface_preflight.py'
      - 'scripts/chatgpt_context_bridge.py'
      - 'tests/test_chatgpt_context_bridge_cli.py'
      - '.github/workflows/spiral-real-journal.yml'
permissions:
  contents: read
jobs:
  real-upstream-spawned-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout real upstream Spiral from pinned audited revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GlacierEQ/spiral-engine
          ref: ef0d9cd80cf987acc0a864a553d72cec8fe1b9cd
          path: spiral-upstream
          persist-credentials: false
      - name: Verify upstream SHA and required source path
        shell: bash
        run: |
          test "$(git -C spiral-upstream rev-parse HEAD)" = "ef0d9cd80cf987acc0a864a553d72cec8fe1b9cd"
          test -f spiral-upstream/src/continuity.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile, prove real journal, spawn fresh chat processes and execute APEX gate
        run: |
          PYTHONPATH=src:. python -m py_compile src/spiral_live_journal.py src/chat_context_admission.py src/continuity_admission_guard.py scripts/chatgpt_context_bridge.py tests/test_chat_context_admission.py tests/test_spiral_live_journal.py tests/test_spiral_kernel_interface_preflight.py tests/test_chatgpt_context_bridge_cli.py
          SPIRAL_REAL_SOURCE_ROOT=spiral-upstream PYTHONPATH=src:. python -m unittest -v tests.test_chat_context_admission tests.test_spiral_live_journal tests.test_spiral_kernel_interface_preflight tests.test_chatgpt_context_bridge_cli
