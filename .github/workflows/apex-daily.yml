name: APEX Daily Autonomous Loop

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 10:00 PM HST
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force full audit regardless of cache'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apex-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --quiet

      - name: Run APEX Autonomous Audit
        id: apex_audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPO: ${{ github.repository }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_DATE: ${{ github.run_id }}
        shell: bash
        run: |
          set +e
          python apex_runner.py --auto-approve --full-audit
          audit_status=$?
          set -e
          echo "status=${audit_status}" >> "$GITHUB_OUTPUT"
          echo "APEX audit exit status captured: ${audit_status}; persistence and notification will run before final status propagation."

      - name: Commit audit results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "APEX Autonomous Agent"
          git config user.email "apex-bot@glaciereq.system"
          git add --ignore-errors audit_log/ findings/ action_queue/ connector_registry.json
          git diff --staged --quiet || git commit -m "audit: daily run $(date -u +%Y-%m-%dT%H:%M:%SZ) [auto]"
          git push

      - name: Auto-create issues for P0/P1 findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python apex_issue_writer.py --auto-approve

      - name: Propagate audit result
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.apex_audit.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          status="${AUDIT_STATUS:-1}"
          if ! [[ "$status" =~ ^[0-9]+$ ]]; then
            echo "Invalid captured audit status: $status" >&2
            exit 1
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "APEX audit reported nonzero status ${status} after receipts and issue creation were attempted." >&2
            exit "$status"
          fi
