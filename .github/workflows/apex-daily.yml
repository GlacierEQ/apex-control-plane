name: APEX Daily Autonomous Loop

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 10:00 PM HST
  workflow_dispatch:       # manual trigger anytime
    inputs:
      force_run:
        description: 'Force full audit regardless of cache'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apex-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --quiet

      - name: Run APEX Autonomous Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPO: ${{ github.repository }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_DATE: ${{ github.run_id }}
        run: |
          python apex_runner.py --auto-approve --full-audit

      - name: Commit audit results
        run: |
          git config user.name  "APEX Autonomous Agent"
          git config user.email "apex-bot@glaciereq.system"
          git add audit_log/ findings/ action_queue/ connector_registry.json
          git diff --staged --quiet || git commit -m "audit: daily run $(date -u +%Y-%m-%dT%H:%M:%SZ) [auto]"
          git push

      - name: Auto-create issues for P0/P1 findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python apex_issue_writer.py --auto-approve
