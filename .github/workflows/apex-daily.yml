name: APEX Daily Audit

on:
  schedule:
    - cron: '0 18 * * *'   # 8:00 AM HST (UTC-10) every day
  workflow_dispatch:         # manual trigger — no approval needed
  push:
    branches: [main]
    paths:
      - 'apex_daily.py'
      - '.github/workflows/apex-daily.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.APEX_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run APEX Daily Audit
        env:
          APEX_GITHUB_TOKEN: ${{ secrets.APEX_GITHUB_TOKEN }}
          APEX_NOTION_TOKEN: ${{ secrets.APEX_NOTION_TOKEN }}
          GITHUB_OWNER: GlacierEQ
        run: python apex_daily.py

      - name: Commit audit log
        run: |
          git config user.email "apex-bot@glaciereq.local"
          git config user.name "APEX Audit Bot"
          git add apex_control_plane.json || true
          git diff --staged --quiet || git commit -m "chore(audit): run #$(python -c "import json; d=json.load(open('apex_control_plane.json')); print(d.get('run_count','?'))") — $(date -u +%Y-%m-%d)"
          git push || true

      - name: Report P0 findings as issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.APEX_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
import json, os, subprocess, datetime
try:
    with open('apex_control_plane.json') as f:
        cp = json.load(f)
    last = cp.get('audit_log', [{}])[-1]
    p0s = [x for x in last.get('findings', []) if x.get('severity') == 'P0']
    if p0s:
        body = '## P0 Findings Requiring Immediate Action\n\n'
        for p in p0s:
            body += f"### [{p['severity']}] {p['title']}\n"
            body += f"- **Domain**: {p['domain']}\n"
            body += f"- **Evidence**: {p['evidence']}\n"
            body += f"- **Action**: {p['action']}\n\n"
        body += f"_Auto-generated by APEX Daily Audit — {datetime.datetime.utcnow().isoformat()}_"
        subprocess.run([
            'gh', 'issue', 'create',
            '--title', f'[APEX P0] {len(p0s)} critical findings — {datetime.date.today()}',
            '--body', body,
            '--label', 'P0,security,automated'
        ], check=False)
except Exception as e:
    print(f'Issue creation skipped: {e}')
EOF
