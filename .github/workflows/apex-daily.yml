name: APEX Daily Evidence Loop

on:
  schedule:
    - cron: '0 18 * * *' # 08:00 HST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: apex-daily-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apex-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Run APEX evidence-led audit
        id: apex_audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUN_DATE: ${{ github.run_id }}
        shell: bash
        run: |
          set +e
          python apex_runner.py --full-audit
          audit_status=$?
          set -e
          echo "status=${audit_status}" >> "$GITHUB_OUTPUT"

      - name: Verify exact run receipt and local readback
        id: verify_receipt
        if: always()
        env:
          RUN_DATE: ${{ github.run_id }}
        run: python apex_runner.py --verify-run "${RUN_DATE}"

      - name: Upload exact audit evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-audit-evidence-${{ github.run_id }}-${{ steps.verify_receipt.outcome }}
          path: |
            audit_log/run_${{ github.run_id }}.json
            audit_log/proof_${{ github.run_id }}.json
            action_queue/queue_${{ github.run_id }}.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish and read back durable audit ledger
        if: always() && steps.verify_receipt.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_DATE: ${{ github.run_id }}
        run: python apex_issue_writer.py --run-id "${RUN_DATE}"

      - name: Propagate audit finding status
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.apex_audit.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          status="${AUDIT_STATUS:-2}"
          if ! [[ "$status" =~ ^[0-9]+$ ]]; then
            echo "Invalid captured audit status: $status" >&2
            exit 2
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "Audit completed with status ${status}; exact receipts, evidence artifact, and verified-ledger publication were attempted before propagation." >&2
            exit "$status"
          fi
