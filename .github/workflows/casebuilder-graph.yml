name: Jack CaseBuilder Graph

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "jack/**"
      - "legal/schemas/casebuilder_*.schema.json"
      - "machine/casebuilder.json"
      - ".github/workflows/casebuilder-graph.yml"
  push:
    branches: [main]
    paths:
      - "jack/**"
      - "legal/schemas/casebuilder_*.schema.json"
      - "machine/casebuilder.json"
      - ".github/workflows/casebuilder-graph.yml"

permissions:
  contents: read

jobs:
  graph-regression:
    name: Jack CaseBuilder full graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile CaseBuilder graph runtime
        run: python -m py_compile jack/src/casebuilder.py jack/src/casegraph.py

      - name: Validate machine contracts and schemas
        run: |
          python -m json.tool jack/config/casebuilder_contract.json >/dev/null
          python -m json.tool jack/config/casebuilder_graph_contract.json >/dev/null
          python -m json.tool legal/schemas/casebuilder_case.schema.json >/dev/null
          python -m json.tool legal/schemas/casebuilder_graph.schema.json >/dev/null
          python -m json.tool machine/casebuilder.json >/dev/null

      - name: Run full CaseBuilder regression suite
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=. python -m pytest -q \
            jack/tests/test_casebuilder.py \
            jack/tests/test_casegraph.py
