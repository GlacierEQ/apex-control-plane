name: corpus-refinery

on:
  pull_request:
    paths:
      - 'src/corpus_refinery.py'
      - 'tests/test_corpus_refinery.py'
      - 'db/migrations/20260822_forensic_progressive_text_spans_v1.sql'
      - '.github/workflows/corpus-refinery.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile corpus refinery
        run: python -m py_compile src/corpus_refinery.py
      - name: Run corpus refinery tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_corpus_refinery.py
