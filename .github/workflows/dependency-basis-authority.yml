name: Dependency Basis Authority

on:
  pull_request:
    branches: [main]
    paths:
      - "src/dependency_basis_authority.py"
      - "tests/test_dependency_basis_authority.py"
      - ".github/workflows/dependency-basis-authority.yml"
  push:
    branches: [main]
    paths:
      - "src/dependency_basis_authority.py"
      - "tests/test_dependency_basis_authority.py"
      - ".github/workflows/dependency-basis-authority.yml"

permissions:
  contents: read

jobs:
  dependency-basis-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile dependency basis authority
        run: python -m py_compile src/dependency_basis_authority.py
      - name: Run adversarial dependency-basis suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_dependency_basis_authority.py
