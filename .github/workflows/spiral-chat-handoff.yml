name: APEX Spiral Chat Session Handoff
on:
  pull_request:
    paths:
      - 'src/spiral_chat_handoff.py'
      - 'tests/test_spiral_chat_handoff.py'
      - '.github/workflows/spiral-chat-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'src/spiral_chat_handoff.py'
      - 'tests/test_spiral_chat_handoff.py'
      - '.github/workflows/spiral-chat-handoff.yml'
permissions:
  contents: read
jobs:
  cross-chat-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile source and tests
        run: python -m py_compile src/spiral_chat_handoff.py tests/test_spiral_chat_handoff.py
      - name: Prove independent chat recovery and APEX source binding
        run: PYTHONPATH=src python -m unittest -v tests.test_spiral_chat_handoff
