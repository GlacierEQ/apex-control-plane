name: APEX Daily Autonomous Audit

on:
  schedule:
    # Runs every day at 08:00 HST (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

jobs:
  apex-audit:
    name: APEX Audit Loop
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run APEX Daily Audit
        env:
          APEX_GITHUB_TOKEN: ${{ secrets.APEX_GITHUB_TOKEN }}
          APEX_NOTION_TOKEN: ${{ secrets.APEX_NOTION_TOKEN }}
        run: python daily_audit.py

      - name: Commit audit log
        run: |
          git config user.name "APEX Autonomous Agent"
          git config user.email "GLACIER.EQUILIBRIUM@GMAIL.COM"
          git add audit_logs/
          git diff --cached --quiet || git commit -m "🤖 AUTO: Audit run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open GitHub Issue for P0 findings
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readdirSync('audit_logs').sort().reverse();
            if (!files.length) return;
            const log = JSON.parse(fs.readFileSync('audit_logs/' + files[0]));
            const p0 = log.action_queue.immediate;
            if (!p0.length) {
              console.log('No P0 findings. No issue created.');
              return;
            }
            const body = p0.map(f =>
              `### ${f.severity} — ${f.domain}: ${f.title}\n**Evidence:** ${f.evidence}\n**Action:** ${f.action}`
            ).join('\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 APEX P0 Findings — ${new Date().toISOString().split('T')[0]}`,
              body: `## Autonomous Audit P0 Report\n\n${body}\n\n*Auto-generated by APEX Daily Audit Loop*`,
              labels: ['P0', 'security', 'auto-audit']
            });
