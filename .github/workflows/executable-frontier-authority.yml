name: Executable Frontier Authority

on:
  pull_request:
    branches: [main]
    paths:
      - "src/executable_frontier_authority.py"
      - "src/execution_evidence_authority.py"
      - "src/execution_evidence_lineage.py"
      - "src/operator_source_binding_contract.py"
      - "src/model_attractor_defense.py"
      - "src/strict_executable_frontier_authority.py"
      - "src/strict_frontier_preflight.py"
      - "src/verifier_execution_authority.py"
      - "tests/test_operator_source_binding_contract.py"
      - "tests/test_executable_frontier_authority.py"
      - "tests/test_frontier_execution_lineage_coupling.py"
      - "tests/test_model_attractor_defense.py"
      - "tests/test_strict_executable_frontier_authority.py"
      - "tests/test_strict_frontier_preflight_resolver.py"
      - ".github/workflows/executable-frontier-authority.yml"
  push:
    branches: [main]
    paths:
      - "src/executable_frontier_authority.py"
      - "src/execution_evidence_authority.py"
      - "src/execution_evidence_lineage.py"
      - "src/operator_source_binding_contract.py"
      - "src/model_attractor_defense.py"
      - "src/strict_executable_frontier_authority.py"
      - "src/strict_frontier_preflight.py"
      - "src/verifier_execution_authority.py"
      - "tests/test_operator_source_binding_contract.py"
      - "tests/test_executable_frontier_authority.py"
      - "tests/test_frontier_execution_lineage_coupling.py"
      - "tests/test_model_attractor_defense.py"
      - "tests/test_strict_executable_frontier_authority.py"
      - "tests/test_strict_frontier_preflight_resolver.py"
      - ".github/workflows/executable-frontier-authority.yml"

permissions:
  contents: read

jobs:
  executable-frontier-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile frontier and execution authority boundaries
        run: python -m py_compile src/operator_source_binding_contract.py src/execution_evidence_authority.py src/execution_evidence_lineage.py src/executable_frontier_authority.py src/model_attractor_defense.py src/strict_executable_frontier_authority.py src/strict_frontier_preflight.py src/verifier_execution_authority.py
      - name: Run frontier authority adversarial suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_operator_source_binding_contract.py tests/test_executable_frontier_authority.py tests/test_frontier_execution_lineage_coupling.py tests/test_model_attractor_defense.py tests/test_strict_executable_frontier_authority.py tests/test_strict_frontier_preflight_resolver.py
