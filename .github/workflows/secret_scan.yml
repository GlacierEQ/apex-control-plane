name: Secret Leakage Scanner

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    name: Scan for exposed credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --verbose --redact

      - name: Python secret pattern scan
        run: |
          python3 << 'EOF'
          import os, re, sys
          patterns = [
              ("github_token", r"gh[pousr]_[A-Za-z0-9]{36,}"),
              ("notion_token", r"secret_[A-Za-z0-9]{43}"),
              ("openai_key", r"sk-[A-Za-z0-9]{48}"),
              ("generic_secret", r"(?i)(api_key|api-key|apikey|auth_token|secret)[\s=:\"']+[A-Za-z0-9_\-]{20,}"),
          ]
          found = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in [".git", "venv", ".venv", "node_modules"]]
              for fname in files:
                  if not any(fname.endswith(ext) for ext in [".py",".js",".ts",".json",".yaml",".yml",".md",".env",".txt"]):
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      content = open(fpath).read()
                  except:
                      continue
                  for label, pat in patterns:
                      if re.search(pat, content):
                          found.append(f"{fpath}: {label}")
          if found:
              print("SECRET LEAKAGE DETECTED:")
              for f in found:
                  print(f"  {f}")
              sys.exit(1)
          else:
              print("Clean: no secrets detected")
          EOF
