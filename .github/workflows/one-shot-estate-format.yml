name: One-shot estate registry formatter

on:
  push:
    branches:
      - automation/estate-registry-clean-20260808

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/estate-registry-clean-20260808
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Ruff canonical formatting and self-remove
        run: |
          python -m pip install --upgrade ruff
          ruff format scripts/scan_repos.py tests/test_scan_repos.py
          rm .github/workflows/one-shot-estate-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/scan_repos.py tests/test_scan_repos.py .github/workflows/one-shot-estate-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: apply ruff format to estate registry'
          git push origin HEAD:automation/estate-registry-clean-20260808
