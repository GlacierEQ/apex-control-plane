name: CASEBRAIN Pro-Code Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "STATE.md"
      - "AKOS_ADOPTION.yaml"
      - "docs/UNIFIED_CASEBRAIN.md"
      - ".github/workflows/casebrain-ci.yml"
  push:
    branches:
      - main
      - "feat/unified-casebrain-*"
      - "prime-directive-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test safety and resilience invariants
        run: python -m pytest -q
      - name: Runtime smoke test validates local receipt without external-action claims
        run: |
          python src/control_plane.py > /tmp/casebrain-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/casebrain-smoke.json").read_text())
          assert result.get("status") == "ok", "current runtime status not returned"
          receipt = result.get("receipt")
          assert isinstance(receipt, dict), "local receipt missing"
          assert receipt.get("label") == "control_plane_main", "unexpected runtime receipt"
          assert receipt.get("before") == {"routes_run": 0}, "unexpected local prestate"
          assert receipt.get("after") == {"routes_run": 1}, "unexpected local poststate"
          assert result.get("external_action_authorized") is not True, "blanket authorization asserted"
          assert receipt.get("external_action_authorized") is not True, "blanket authorization asserted"
          # This synthetic local receipt does not prove a provider-side action.
          PY
