name: CASEBRAIN Pro-Code Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "STATE.md"
      - "AKOS_ADOPTION.yaml"
      - "docs/UNIFIED_CASEBRAIN.md"
      - ".github/workflows/casebrain-ci.yml"
  push:
    branches:
      - main
      - "feat/unified-casebrain-*"
      - "prime-directive-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test safety and resilience invariants
        run: python -m pytest -q
      - name: Control plane CLI receipt smoke (not a provider execution claim)
        run: |
          python src/control_plane.py > /tmp/casebrain-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path("/tmp/casebrain-smoke.json").read_text())
          assert proof.get("status") == "ok", "CLI receipt did not report current status"
          receipt = proof.get("receipt")
          assert isinstance(receipt, dict), "missing CLI receipt"
          assert isinstance(receipt.get("before"), dict), "missing before state"
          assert isinstance(receipt.get("after"), dict), "missing after state"
          assert receipt.get("label") == "control_plane_main", "wrong CLI entrypoint"
          assert '"external_action_authorized": true' not in json.dumps(proof), "blanket external authorization invented"
          PY
