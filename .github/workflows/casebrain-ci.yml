name: CASEBRAIN Pro-Code Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "AGENT_SYSTEM_PROMPT.md"
      - "STATE.md"
      - "config/prime_directive_policy.json"
      - "AKOS_ADOPTION.yaml"
      - "docs/UNIFIED_CASEBRAIN.md"
      - ".github/workflows/casebrain-ci.yml"
  push:
    branches:
      - main
      - "feat/unified-casebrain-*"
      - "prime-directive-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test safety and resilience invariants
        run: python -m pytest -q
      - name: Synthetic read-only smoke test in explicit degraded mode
        run: |
          CASEY_AUTO_BOOT_MODE=request \
          python src/control_plane.py \
            > /tmp/casebrain-smoke.json \
            2> /tmp/casebrain-boot-request.json
          grep -q 'glaciereq_prime_directive_auto_boot' /tmp/casebrain-boot-request.json
          grep -q 'ground_truth_files_loaded' /tmp/casebrain-boot-request.json
          grep -q 'tool_inventory' /tmp/casebrain-boot-request.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/casebrain-smoke.json').read_text())
          assert result['status'] == 'completed'
          assert result['human_review_required'] is True
          assert result['external_action_authorized'] is False
          PY
