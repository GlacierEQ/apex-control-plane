name: CASEBRAIN Pro-Code Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "STATE.md"
      - "AKOS_ADOPTION.yaml"
      - "docs/UNIFIED_CASEBRAIN.md"
      - ".github/workflows/casebrain-ci.yml"
  push:
    branches:
      - main
      - "feat/unified-casebrain-*"
      - "prime-directive-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test safety and resilience invariants
        run: python -m pytest -q
      - name: Proactive smoke test emits a before/after receipt
        run: |
          python src/control_plane.py > /tmp/casebrain-smoke.json
          test -s /tmp/casebrain-smoke.json
          grep -q '"status": "proactive"' /tmp/casebrain-smoke.json
          grep -q '"diff"' /tmp/casebrain-smoke.json
          if grep -q '"external_action_authorized": true' /tmp/casebrain-smoke.json; then
            echo "smoke output must not manufacture blanket external authorization" >&2
            exit 1
          fi
