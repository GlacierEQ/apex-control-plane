name: CASEBRAIN Pro-Code Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "STATE.md"
      - "AKOS_ADOPTION.yaml"
      - "docs/UNIFIED_CASEBRAIN.md"
      - ".github/workflows/casebrain-ci.yml"
  push:
    branches:
      - main
      - "feat/unified-casebrain-*"
      - "prime-directive-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test safety and resilience invariants
        run: python -m pytest -q
      - name: Unbound CLI cannot fake an executed provider route
        run: |
          set +e
          python src/control_plane.py > /tmp/casebrain-smoke.json
          rc=$?
          set -e
          test "$rc" -eq 78
          python - <<'PY'
          import json
          with open("/tmp/casebrain-smoke.json", encoding="utf-8") as fp:
              payload = json.load(fp)
          assert payload["status"] == "HOST_EXECUTOR_NOT_BOUND"
          assert payload["routes_run"] == 0
          assert payload["provider_receipt"] is None
          assert payload["continuation_verified"] is False
          assert "before" not in payload and "after" not in payload
          PY
