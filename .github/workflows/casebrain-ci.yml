name: CASEBRAIN Pro-Code Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "STATE.md"
      - "AKOS_ADOPTION.yaml"
      - "docs/UNIFIED_CASEBRAIN.md"
      - ".github/workflows/casebrain-ci.yml"
  push:
    branches:
      - main
      - "feat/unified-casebrain-*"
      - "prime-directive-*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test safety and resilience invariants
        run: python -m pytest -q
      - name: Proactive smoke test proves durable event routing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory() as root:
              state = Path(root) / "state"
              event = Path(root) / "event.json"
              event.write_text(json.dumps({
                  "event_type": "gmail.reply.received",
                  "source_system": "gmail",
                  "subject_id": "SMOKE",
                  "correlation_id": "smoke-corr",
                  "payload": {"message_id": "smoke-m1"},
                  "provenance_refs": ["gmail://message/smoke-m1"]
              }))
              command = [sys.executable, "src/control_plane.py",
                         "--event-file", str(event), "--state-dir", str(state)]
              out = json.loads(subprocess.check_output(command, text=True))
              assert out["status"] == "ingested", out
              assert out["receipt"]["diff"]["events"] == 1, out
              assert out["receipt"]["diff"]["work"] == 1, out
              assert out["readback"]["events"] == 1, out
              assert out["readback"]["work"] == 1, out
              again = json.loads(subprocess.check_output(command, text=True))
              assert again["status"] == "duplicate", again
              assert again["receipt"]["diff"]["events"] == 0, again
          PY
