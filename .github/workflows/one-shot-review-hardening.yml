name: One-shot estate registry review hardening

on:
  push:
    branches:
      - automation/estate-registry-clean-20260808

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/estate-registry-clean-20260808
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          scan_path = Path('scripts/scan_repos.py')
          scan = scan_path.read_text()

          old = '''def classify(repo: dict[str, Any]) -> str:\n    name = str(repo.get("name") or "").casefold()\n    if repo.get("archived"):\n        return "archived"\n    if name.startswith(("z-backup", "backup-", "archive-")):\n        return "archived"\n    if any(marker in name for marker in EXPERIMENT_MARKERS):\n        return "experimental"\n    if any(marker in name for marker in CONTROL_MARKERS):\n        return "canonical-control-plane"\n    if any(marker in name for marker in LEGAL_MARKERS):\n        return "legal-process"\n    if any(marker in name for marker in MEMORY_MARKERS):\n        return "memory-connector"\n    if any(marker in name for marker in RUNTIME_MARKERS):\n        return "production-runtime"\n    return "unknown-ownership"\n'''
          new = '''def _has_name_marker(name: str, marker: str) -> bool:\n    normalized_name = re.sub(r"[-_]+", "-", name.casefold())\n    normalized_marker = re.sub(r"[-_]+", "-", marker.casefold())\n    return (\n        re.search(\n            rf"(?:^|-){re.escape(normalized_marker)}(?:-|$)",\n            normalized_name,\n        )\n        is not None\n    )\n\n\ndef classify(repo: dict[str, Any]) -> str:\n    name = str(repo.get("name") or "").casefold()\n    if repo.get("archived"):\n        return "archived"\n    if name.startswith(("z-backup", "backup-", "archive-")):\n        return "archived"\n    if any(_has_name_marker(name, marker) for marker in EXPERIMENT_MARKERS):\n        return "experimental"\n    if any(_has_name_marker(name, marker) for marker in CONTROL_MARKERS):\n        return "canonical-control-plane"\n    if any(_has_name_marker(name, marker) for marker in LEGAL_MARKERS):\n        return "legal-process"\n    if any(_has_name_marker(name, marker) for marker in MEMORY_MARKERS):\n        return "memory-connector"\n    if any(_has_name_marker(name, marker) for marker in RUNTIME_MARKERS):\n        return "production-runtime"\n    return "unknown-ownership"\n'''
          scan = replace_once(scan, old, new, 'classification block')

          old = '''def name_signature(name: str) -> str:\n    value = name.casefold()\n    value = re.sub(r"^(z-?backup[-_]*|backup[-_]*|archive[-_]*)", "", value)\n    value = re.sub(r"[-_]?v\\d+(?:[-_.]\\d+)*$", "", value)\n    value = re.sub(r"[-_](copy|old|legacy|deprecated|archive|backup)$", "", value)\n    return re.sub(r"[^a-z0-9]+", "", value)\n'''
          new = '''def name_signature(name: str) -> str:\n    value = name.casefold()\n    value = re.sub(r"^(z-?backup[-_]*|backup[-_]*|archive[-_]*)", "", value)\n    while True:\n        previous = value\n        value = re.sub(r"[-_]?v\\d+(?:[-_.]\\d+)*$", "", value)\n        value = re.sub(\n            r"[-_](copy|old|legacy|deprecated|archive|backup)$", "", value\n        )\n        if value == previous:\n            break\n    return re.sub(r"[^a-z0-9]+", "", value)\n'''
          scan = replace_once(scan, old, new, 'name signature block')

          old = '''def write_json(path: Path, payload: dict[str, Any]) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    temp_path: Path | None = None\n    try:\n        with tempfile.NamedTemporaryFile(\n            mode="w",\n            encoding="utf-8",\n            dir=path.parent,\n            prefix=f".{path.name}.",\n            suffix=".tmp",\n            delete=False,\n        ) as handle:\n            json.dump(payload, handle, indent=2, sort_keys=False)\n            handle.write("\\n")\n            handle.flush()\n            os.fsync(handle.fileno())\n            temp_path = Path(handle.name)\n        os.replace(temp_path, path)\n        temp_path = None\n    finally:\n        if temp_path is not None:\n            temp_path.unlink(missing_ok=True)\n'''
          new = '''def _stage_json(path: Path, payload: dict[str, Any]) -> Path:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    with tempfile.NamedTemporaryFile(\n        mode="w",\n        encoding="utf-8",\n        dir=path.parent,\n        prefix=f".{path.name}.",\n        suffix=".tmp",\n        delete=False,\n    ) as handle:\n        json.dump(payload, handle, indent=2, sort_keys=False)\n        handle.write("\\n")\n        handle.flush()\n        os.fsync(handle.fileno())\n        return Path(handle.name)\n\n\ndef write_json_set(outputs: dict[Path, dict[str, Any]]) -> None:\n    staged: dict[Path, Path] = {}\n    try:\n        for path, payload in outputs.items():\n            staged[path] = _stage_json(path, payload)\n        for path, temp_path in staged.items():\n            os.replace(temp_path, path)\n        staged.clear()\n    finally:\n        for temp_path in staged.values():\n            temp_path.unlink(missing_ok=True)\n\n\ndef write_json(path: Path, payload: dict[str, Any]) -> None:\n    write_json_set({path: payload})\n'''
          scan = replace_once(scan, old, new, 'json writer block')

          old = '''        write_json(REGISTRY_PATH, registry)\n        write_json(DELTA_PATH, delta)\n        write_json(SCAN_PATH, scan)\n'''
          new = '''        write_json_set(\n            {\n                REGISTRY_PATH: registry,\n                DELTA_PATH: delta,\n                SCAN_PATH: scan,\n            }\n        )\n'''
          scan = replace_once(scan, old, new, 'main output block')
          scan_path.write_text(scan)

          test_path = Path('tests/test_scan_repos.py')
          tests = test_path.read_text()
          anchor = '''def test_name_signature_collapses_backup_and_version_suffixes():\n    assert name_signature("Z-BACKUP-apex-memory-v2") == "apexmemory"\n    assert name_signature("apex_memory") == "apexmemory"\n'''
          addition = '''def test_name_signature_collapses_backup_and_version_suffixes():\n    assert name_signature("Z-BACKUP-apex-memory-v2") == "apexmemory"\n    assert name_signature("apex-memory-v2-backup") == "apexmemory"\n    assert name_signature("apex_memory") == "apexmemory"\n\n\ndef test_classification_matches_delimited_markers_only():\n    assert classify(repo(6, "gateway-probe")) == "experimental"\n    assert classify(repo(7, "latest-research")) == "unknown-ownership"\n    assert classify(repo(8, "capital-model")) == "unknown-ownership"\n'''
          tests = replace_once(tests, anchor, addition, 'classification/signature tests')
          test_path.write_text(tests)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          anchor = '''      - name: Ruff lint\n        run: ruff check scripts/scan_repos.py tests/test_scan_repos.py --ignore TRY004 --output-format=github\n\n      - name: Mypy\n'''
          replacement = '''      - name: Ruff lint\n        run: ruff check scripts/scan_repos.py tests/test_scan_repos.py --ignore TRY004 --output-format=github\n\n      - name: Ruff format check\n        run: ruff format --check scripts/scan_repos.py tests/test_scan_repos.py\n\n      - name: Mypy\n'''
          ci = replace_once(ci, anchor, replacement, 'CI formatter gate')
          ci_path.write_text(ci)

          audit_path = Path('.github/workflows/daily_audit.yml')
          audit = audit_path.read_text()
          old = '''          if git ls-remote --exit-code --heads origin estate-registry-state >/dev/null 2>&1; then\n            git fetch --no-tags origin \\\n              refs/heads/estate-registry-state:refs/remotes/origin/estate-registry-state\n            git show refs/remotes/origin/estate-registry-state:repo_registry.json \\\n              > repo_registry.json\n          fi\n'''
          new = '''          if git ls-remote --exit-code --heads origin estate-registry-state >/dev/null 2>&1; then\n            git fetch --no-tags origin \\\n              refs/heads/estate-registry-state:refs/remotes/origin/estate-registry-state\n            git show refs/remotes/origin/estate-registry-state:repo_registry.json \\\n              > repo_registry.json\n          else\n            status=$?\n            if [ "$status" -ne 2 ]; then\n              echo "::error::Unable to determine estate-registry-state branch status"\n              exit "$status"\n            fi\n          fi\n'''
          audit = replace_once(audit, old, new, 'remote state check')
          old = '''      - name: Refresh estate registry\n        env:\n          GITHUB_TOKEN: ${{ github.token }}\n        run: python scripts/scan_repos.py\n'''
          new = '''      - name: Refresh estate registry\n        env:\n          APEX_GITHUB_TOKEN: ${{ secrets.APEX_GITHUB_TOKEN }}\n          GITHUB_TOKEN: ${{ github.token }}\n        run: python scripts/scan_repos.py\n'''
          audit = replace_once(audit, old, new, 'estate auth block')
          old = '''          cp repo_registry.json repo_registry_delta.json repo_scan.json "$state_dir"/\n'''
          new = '''          for file in repo_registry.json repo_registry_delta.json repo_scan.json; do\n            if [ ! -f "$file" ]; then\n              echo "::error::Missing required estate receipt: $file"\n              exit 1\n            fi\n          done\n          cp repo_registry.json repo_registry_delta.json repo_scan.json "$state_dir"/\n'''
          audit = replace_once(audit, old, new, 'receipt copy block')
          audit_path.write_text(audit)
          PY

          python -m pip install --upgrade ruff mypy pytest
          ruff format scripts/scan_repos.py tests/test_scan_repos.py
          ruff check scripts/scan_repos.py tests/test_scan_repos.py --ignore TRY004
          ruff format --check scripts/scan_repos.py tests/test_scan_repos.py
          mypy scripts/scan_repos.py --ignore-missing-imports
          python -m pytest -q tests/test_scan_repos.py

          rm .github/workflows/one-shot-review-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/daily_audit.yml scripts/scan_repos.py tests/test_scan_repos.py .github/workflows/one-shot-review-hardening.yml
          git commit -m 'fix: close estate registry review gates'
          git push origin HEAD:automation/estate-registry-clean-20260808
