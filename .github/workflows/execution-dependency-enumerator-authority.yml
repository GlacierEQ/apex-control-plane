name: Execution Dependency Enumerator Authority

on:
  pull_request:
    branches: [main]
    paths:
      - "src/execution_dependency_enumerator_authority.py"
      - "tests/test_execution_dependency_enumerator_authority.py"
      - ".github/workflows/execution-dependency-enumerator-authority.yml"
  push:
    branches: [main]
    paths:
      - "src/execution_dependency_enumerator_authority.py"
      - "tests/test_execution_dependency_enumerator_authority.py"
      - ".github/workflows/execution-dependency-enumerator-authority.yml"

permissions:
  contents: read

jobs:
  dependency-enumerator-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile dependency enumerator authority
        run: python -m py_compile src/execution_dependency_enumerator_authority.py
      - name: Run dependency enumeration adversarial suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_execution_dependency_enumerator_authority.py
