name: Connector-native mission admission
on:
  pull_request:
    paths:
      - 'src/connector_mission_router.py'
      - 'src/mission_resume.py'
      - 'src/chat_context_admission.py'
      - 'src/apex_session_gateway.py'
      - 'src/spiral_chat_handoff.py'
      - 'src/continuity_admission_guard.py'
      - 'tests/test_connector_mission_router.py'
      - 'tests/test_connector_checkpoint_store.py'
      - 'tests/test_chat_context_admission.py'
      - 'tests/test_apex_session_gateway.py'
      - '.github/workflows/connector-mission-admission.yml'
  push:
    branches: [main]
    paths:
      - 'src/connector_mission_router.py'
      - 'src/mission_resume.py'
      - 'src/chat_context_admission.py'
      - 'src/spiral_chat_handoff.py'
      - 'src/continuity_admission_guard.py'
      - 'tests/test_connector_mission_router.py'
      - 'tests/test_connector_checkpoint_store.py'
      - 'tests/test_chat_context_admission.py'
      - '.github/workflows/connector-mission-admission.yml'
permissions:
  contents: read
jobs:
  source-bound-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
      - name: Compile production and regression modules
        run: |
          PYTHONPATH=. python -m py_compile \
            src/connector_mission_router.py \
            src/mission_resume.py \
            src/chat_context_admission.py \
            src/apex_session_gateway.py \
            src/spiral_chat_handoff.py \
            src/continuity_admission_guard.py \
            tests/test_connector_mission_router.py \
            tests/test_connector_checkpoint_store.py \
            tests/test_chat_context_admission.py \
            tests/test_apex_session_gateway.py
      - name: Prove authentic context admission precedes provider effects
        run: |
          PYTHONPATH=. python -m unittest -v \
            tests.test_connector_mission_router \
            tests.test_connector_checkpoint_store \
            tests.test_chat_context_admission \
            tests.test_apex_session_gateway
